<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, follow">
<title>404 · 这条路手记里没有记过 — 向き</title>
<meta name="description" content="页面不存在。回到向き的个人主页。">
<link rel="icon" type="image/png" href="/personal-site/assets/favicon-64.png">
<!-- GitHub Pages 的项目站会把这页送到任意未知路径下，
     所以这里的链接一律写成绝对路径 —— 相对路径在 /personal-site/a/b/ 下会算错。
     换自定义域名时记得一起改。 -->
<style>
  :root{
    --page-bg:#fdfaf4; --card:#fffdf9;
    --text:oklch(.28 .02 340); --soft:rgb(0 0 0 / 62%); --faint:rgb(0 0 0 / 42%);
    --line:rgb(0 0 0 / 10%);
    --primary:oklch(.68 .15 340); --primary-deep:oklch(.55 .16 340);
    --primary-soft:oklch(.95 .03 340);
    --shadow:0 20px 48px rgb(0 0 0 / 14%);
    --font:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",
           -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --page-bg:#16141a; --card:#201d26;
      --text:oklch(.93 .015 340); --soft:rgb(255 255 255 / 66%); --faint:rgb(255 255 255 / 42%);
      --line:rgb(255 255 255 / 12%);
      --primary:oklch(.76 .13 340); --primary-deep:oklch(.80 .12 340);
      --primary-soft:oklch(.30 .04 340);
      --shadow:0 20px 48px rgb(0 0 0 / 46%);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:grid; place-items:center; padding:clamp(1rem,4vw,3rem);
    background:var(--page-bg); color:var(--text); font-family:var(--font);
    line-height:1.7; -webkit-font-smoothing:antialiased;
    /* 一小片暖光，别让整页死平 */
    background-image:
      radial-gradient(60rem 30rem at 82% -8%, color-mix(in oklab, var(--primary) 22%, transparent), transparent 70%),
      radial-gradient(48rem 26rem at 6% 104%, color-mix(in oklab, var(--primary) 12%, transparent), transparent 70%);
  }
  .wrap{width:min(46rem,100%)}
  .brand{display:inline-flex; align-items:center; gap:.55rem; font-size:.82rem;
         letter-spacing:.16em; color:var(--soft); margin-bottom:clamp(1rem,3vw,1.75rem)}
  .brand i{display:block; width:2.1rem; height:2px; background:var(--primary-deep); border-radius:2px}
  .card{
    background:color-mix(in oklab, var(--card) 92%, transparent);
    border:1px solid var(--line); border-radius:1.5rem;
    padding:clamp(1.4rem,4vw,2.6rem);
    box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
  }
  .code{
    font-size:clamp(3.6rem,13vw,6.2rem); font-weight:900; line-height:.95; margin:0;
    letter-spacing:.02em; color:transparent;
    -webkit-text-stroke:2.5px var(--primary-deep);
    font-family:var(--font);
  }
  /* 没有 -webkit-text-stroke 的浏览器里，描边字会整块消失 —— 退回实心色 */
  @supports not (-webkit-text-stroke: 1px black){ .code{ color:var(--primary-deep) } }
  h1{font-size:clamp(1.15rem,3.4vw,1.6rem); margin:.9rem 0 .4rem; letter-spacing:.01em}
  p{margin:.4rem 0; color:var(--soft)}
  .note{font-size:.86rem; color:var(--faint); margin-top:1.1rem}
  .pic{
    margin:1.6rem 0 .4rem; background:#fff; border-radius:1rem; overflow:hidden;
    border:1px solid var(--line); display:grid; place-items:center;
  }
  .pic img{display:block; width:min(22rem,100%); height:auto}
  .acts{display:flex; flex-wrap:wrap; gap:.7rem; margin-top:1.6rem}
  a.btn{
    display:inline-flex; align-items:center; gap:.45rem;
    padding:.7rem 1.35rem; border-radius:9999px; text-decoration:none;
    font-size:.94rem; font-weight:600; color:var(--text);
    background:var(--primary-soft); border:1px solid var(--line);
    transition:transform .18s cubic-bezier(.16,1,.3,1), background .18s, box-shadow .18s;
  }
  a.btn:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgb(0 0 0 / 12%) }
  a.btn:active{ transform:translateY(0) }
  a.btn--main{ background:var(--primary-deep); border-color:transparent; color:#fff }
  a.btn:focus-visible{ outline:3px solid var(--primary); outline-offset:3px }
  .dashes{display:flex; gap:.4rem; margin-top:1.5rem}
  .dashes span{height:2px; background:var(--line); border-radius:2px}
  .dashes span:nth-child(1){width:2.6rem; background:var(--primary-deep); opacity:.55}
  .dashes span:nth-child(2){width:1.1rem}
  .dashes span:nth-child(3){width:3.4rem}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important}
    a.btn:hover{transform:none}
  }
</style>
</head>
<body>
  <main class="wrap">
    <p class="brand"><i></i>MUKI · 旅人手记</p>

    <div class="card">
      <p class="code" aria-hidden="true">404</p>
      <h1>这条路，手记里没有记过。</h1>
      <p>你要找的页面可能被搬走了，也可能从来就没写过 —— 旅人偶尔也会走错方向。</p>

      <div class="pic">
        <img src="/personal-site/assets/chibi-tired.webp" alt="趴在地上、一脸疲惫的伊蕾娜" width="520" height="324">
      </div>
      <p class="note">别急，从下面挑一条路回去。</p>

      <div class="acts">
        <a class="btn btn--main" href="/personal-site/">回到首页</a>
        <a class="btn" href="/personal-site/#projects">看看项目</a>
        <a class="btn" href="/personal-site/#tags">技能标签墙</a>
      </div>

      <div class="dashes" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </main>
</body>
</html>
